<main class="pagina">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Cadastro de projetos</mat-card-title>
      <mat-card-subtitle>
        Informe os dados do projeto
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-form-field appearance="outline">
        <mat-label>Nome do projeto</mat-label>
        <input
          matInput
          name="nome"
          [(ngModel)]="nome"
          required
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Descrição</mat-label>
        <textarea
          matInput
          name="descricao"
          rows="4"
          [(ngModel)]="descricao"
        ></textarea>
      </mat-form-field>

      @if (mensagem) {
        <p role="status">{{ mensagem }}</p>
      }
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-button type="button" (click)="limpar()">
        Limpar
      </button>

      <button
        mat-flat-button
        type="button"
        [disabled]="!nome.trim()"
        (click)="salvar()"
      >
        Salvar projeto
      </button>
    </mat-card-actions>
  </mat-card>
</main>
